# PharmaTrace AI - Render Deployment Blueprint
# This configuration creates a PostgreSQL database, the Flask AI Service, and the Express Main Server.

databases:
  - name: pharmatrace-db
    databaseName: pharmatrace
    user: pharmatrace_user
    plan: free

services:

  # ── Flask AI Service ──────────────────────────────────────────
  - type: web
    name: pharmatrace-ai-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python fraud_detection.py
    rootDir: ai_service
    plan: free
    envVars:
      - key: PORT
        value: 5001

  # ── Main Express Server ───────────────────────────────────────
  - type: web
    name: pharmatrace-web-server
    env: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: pharmatrace-ai-service
          property: host
      # Link DB properties using Render's database references
      - key: DB_HOST
        fromDatabase:
          name: pharmatrace-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pharmatrace-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: pharmatrace-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pharmatrace-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pharmatrace-db
          property: password
