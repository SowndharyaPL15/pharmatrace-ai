# PharmaTrace AI - Render Deployment Blueprint
# This configuration creates a PostgreSQL database, the Flask AI Service, and the Express Main Server.

services:

  # ── Flask AI Service ──────────────────────────────────────────
  - type: web
    name: pharmatrace-ai-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python fraud_detection.py
    rootDir: ai_service
    plan: free
    envVars:
      - key: PORT
        value: 5001
      - key: PYTHON_VERSION
        value: 3.11.9

  # ── Main Express Server ───────────────────────────────────────
  - type: web
    name: pharmatrace-web-server
    env: node
    buildCommand: rm -rf node_modules && npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: pharmatrace-ai-service
          property: host
      # Link DB directly using Neon Connection URI string (added manually in Render dashboard env key)
      - key: DATABASE_URL
        sync: false
